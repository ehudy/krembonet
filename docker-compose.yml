services:
  hub:
    build: .
    image: krembonet:latest
    container_name: krembonet
    restart: unless-stopped
    ports:
      - '8080:3000'
    volumes:
      # SQLite lives here so settings and history survive a rebuild.
      - ./data:/app/data
    # Optional, and it has to be: `docker compose up -d --build` is documented
    # as working on a clean checkout, where no .env exists. Compose already
    # reads .env for the ${...} defaults below; this passes through anything
    # that is *not* in the map, so a variable added to .env later is not
    # silently dropped. The explicit map still wins where the two overlap.
    env_file:
      - path: .env
        required: false
    environment:
      NODE_ENV: production
      PORT: 3000
      # Bind inside the container, which is not the same question as which host
      # interface the published port listens on — that is the `ports:` line
      # above. 0.0.0.0 here is what lets Docker reach the process at all.
      HOST: ${HOST:-0.0.0.0}
      # Set this to your own zone. Left at UTC the poller's cron runs in UTC,
      # which matters as soon as alerts are tied to a time of day.
      TZ: ${TZ:-UTC}
      DATABASE_PATH: /app/data/krembonet.db
      # No default: an unset device means an empty dashboard, not a poll against
      # somebody else's address. Set both or neither.
      PLOTTER_HOST: ${PLOTTER_HOST:-}
      PLOTTER_IPP_URI: ${PLOTTER_IPP_URI:-}
      PLOTTER_NAME: ${PLOTTER_NAME:-}
      MEDIA_PACK_PATH: ${MEDIA_PACK_PATH:-}
      BACKGROUND_POLL_MINUTES: ${BACKGROUND_POLL_MINUTES:-60}
      # Was missing while .env.example documented it, so setting it there had
      # no effect in Docker — the one place most people run this.
      DEVICE_TIMEOUT_MS: ${DEVICE_TIMEOUT_MS:-5000}
      LOG_LEVEL: ${LOG_LEVEL:-}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      SESSION_HOURS: ${SESSION_HOURS:-12}
      # Optional. Left blank, one is generated on first boot and kept in the
      # database, so sessions survive a restart with no configuration.
      SESSION_SECRET: ${SESSION_SECRET:-}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      # Optional. Left blank, the container generates a key on first boot and
      # keeps it at /app/data/encryption.key on the volume below, so a plain
      # `docker compose up -d --build` works with no setup. Deliberately no
      # default value here: a shipped fallback would mean every install that
      # forgot to set one shared the same key, which is no encryption at all.
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:-}
      VIEWER_SESSION_HOURS: ${VIEWER_SESSION_HOURS:-720}
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-}
      DISCOVERY_ALLOW_PUBLIC_RANGES: ${DISCOVERY_ALLOW_PUBLIC_RANGES:-false}
      DISCOVERY_DEADLINE_MS: ${DISCOVERY_DEADLINE_MS:-120000}
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://localhost:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

  # Optional uptime monitoring alongside the hub. Opt in with:
  #   docker compose --profile monitoring up -d
  # Kept behind a profile so the default deployment stays a single service.
  uptime-kuma:
    image: louislam/uptime-kuma:1
    container_name: krembonet-uptime-kuma
    restart: unless-stopped
    profiles: ['monitoring']
    ports:
      - '3001:3001'
    volumes:
      - uptime-kuma-data:/app/data

volumes:
  uptime-kuma-data:
